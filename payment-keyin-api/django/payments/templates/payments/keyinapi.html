<!DOCTYPE html>
<html lang="ko">
{% load static %}

  <head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="{% static 'payments/bulma/bulma.min.css' %}"/>
      
  <title>결제 성공 (Django)</title>
</head>
    
<body>
    
<section>
    <h1>{% if code %}결제 실패{% else %}결제 성공{% endif %}</h1>
    
    {% if code %}
    <p>에러코드 : {{ code }}</p>
    <p>에러메시지 : {{ message }}</p>
    {% endif %}
    <br><br>
    <pre>
      method = {{ method }}
      card -> number :  = {{ number }}</pre>
    
</section> 

<button class="button is-link" onclick="location.href='/payments/';">돌아가기</button>
    
</body>
</html>
