<!DOCTYPE html>
<html lang="ko">
{% load static %}

  <head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="{% static 'payments/bulma/bulma.min.css' %}"/>
      
  <title>조회 성공 (Django)</title>
</head>
    
<body>
    
<section>
    <h1>{% if code %}조회 실패{% else %}조회 성공{% endif %}</h1>
    
    {% if code %}
    <p>에러코드 : {{ code }}</p>
    <p>에러메시지 : {{ message }}</p>
    {% else %}
    <p>orderId : {{ orderId }}</p>
    <p>orderName : {{ orderName }}</p>
    <p>status : {{ status }}</p>
    <p>method : {{ method }}</p>
    <p>totalAmount : {{ totalAmount }}</p>
    {% endif %}
    <br><br>
    
</section> 

<button class="button is-link" onclick="location.href='/payments/';">돌아가기</button>
    
</body>
</html>
